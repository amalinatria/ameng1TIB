<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else js</title>
</head>
<body>
    <button onclick="cekNilai()">Cek Nilai</button>
    <p id="hasil"></p>

    <script>
        function cekNilai() {
            let nilai=80;
            let status;

            if (nilai>75) {
                status="Lulus";
            } else {
                status="Tidak Lulus";
            }

            document.getElementById("hasil").innerHTML = status;
        }
    </script>
</body>
</html>
