<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(198, 233, 243); font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color: rgb(71, 70, 70);">
    <fieldset style="background-color: rgb(152, 196, 236);">
        <legend>Login</legend>
        <table>
            <tr>
                <td>Username</td>
                <td>:</td>
                <td><input type="text" placeholder="Username"></td>            
            </tr>
            <tr>
                <td>Password</td>
                <td>:</td>
                <td><input type="password" placeholder="Password"></td>            
            </tr>
            <tr>
                <td><input type="submit" value="Login"></td>
            </tr>
        </table>
    </fieldset>
</body>
</html>
