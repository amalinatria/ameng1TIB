<html>
<head>
<script language="javascript">
    <!--Start of scroller script-->
    var scrollCounter = 0;
    var scrollText    = "Teks yang anda inginkan, misalnya Viva Indroprog";
    var scrollDelay   = 70;
    var i = 0;
    while (i++ < 140)
        scrollText = " " + scrollText;
    function scroller()
    {
        window.status = scrollText.substring(scrollCounter++, scrollText.length);
        if (scrollCounter == scrollText.length)
        scrollCounter = 0;
        setTimeout("scroller()", scrollDelay)
    }
    scroller();
    //End of scroller script -->
</script>
</head>
<body>
    <h1> Coba perhatikan status bar anda </h1>
</body>
</html>
