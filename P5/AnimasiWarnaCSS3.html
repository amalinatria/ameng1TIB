<html>
<head>
    <style>
        div {
            width: 100px;
            height: 100px;
            background: red;
            animation: myfirst 5s;
            -webkit-animation: myfirst 5s;
        }
        @keyframes myfirst {
            from {
                background: red;
            }

            to {
                background: yellow;
            }
        }
        @-webkit-keyframes {
            from {
                background: red;
            }

            to {
                background: yellow;
            }
        }
    </style>
</head>
<title> CSS3 - Animasi Warna </title>
<body>
    <h3> Animasi Warna CSS3 </h3>
    <div>
    </div>
</body>
</html>
